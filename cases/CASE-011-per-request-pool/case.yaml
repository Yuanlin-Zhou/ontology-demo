id: CASE-011
title: 实时推送（请求内创建线程池）
task: 实时事件推送需要在方法内完成，但不能每个事件都新建线程池。
language: java
domain: thread_pool
files:
  before: before.java
  bad: bad.java
  good: good.java
expected:
  features:
    - THREAD_POOL.CREATE
    - THREAD_POOL.CREATE.PER_REQUEST
    - THREAD_POOL.CONFIG.CORE_SIZE
    - THREAD_POOL.CONFIG.MAX_SIZE
    - THREAD_POOL.CONFIG.KEEP_ALIVE
    - THREAD_POOL.CONFIG.QUEUE
    - THREAD_POOL.CONFIG.REJECTION
    - THREAD_POOL.CONFIG.THREAD_FACTORY
    - THREAD_POOL.SUBMIT
    - THREAD_POOL.EXECUTE
    - THREAD_POOL.EXCEPTION
    - THREAD_POOL.SHUTDOWN
  rules:
    - TP-CONFIG-001
    - TP-CONFIG-002
    - TP-CONFIG-003
    - TP-CONFIG-004
    - TP-CONFIG-005
    - TP-CONFIG-006
    - TP-CREATE-001
    - TP-CREATE-002
    - TP-CREATE-003
    - TP-CREATE-004
    - TP-MONITOR-001
    - TP-REJECT-001
    - TP-REJECT-002
    - TP-REJECT-003
    - TP-REJECT-004
    - TP-SHUTDOWN-001
    - TP-SHUTDOWN-002
    - TP-SHUTDOWN-003
    - TP-SUBMIT-001
    - TP-SUBMIT-005
  optional_rules: []
  violations:
    - TP-CREATE-002
    - TP-REJECT-003
    - TP-SHUTDOWN-002
  compliant_violations: []
notes:
  - 方法内创建的线程池不计入"应用级线程池"，因此 TP-SHUTDOWN-001 / TP-MONITOR-001 在此用例不报违规。
