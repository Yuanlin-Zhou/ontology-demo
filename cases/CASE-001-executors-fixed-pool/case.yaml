id: CASE-001
title: 订单异步通知（Executors 快捷工厂）
task: 给 OrderService 增加订单创建后的异步通知能力，通知失败不能影响下单主流程。
language: java
domain: thread_pool
files:
  before: before.java
  bad: bad.java
  good: good.java
expected:
  # 现状使用 Executors.newFixedThreadPool：语义上"创建了无界队列的线程池"
  features:
    - THREAD_POOL.CREATE
    - THREAD_POOL.CREATE.EXECUTORS_FACTORY
    - THREAD_POOL.CONFIG.CORE_SIZE
    - THREAD_POOL.CONFIG.MAX_SIZE
    - THREAD_POOL.CONFIG.QUEUE
    - THREAD_POOL.SUBMIT
    - THREAD_POOL.EXECUTE
  rules:
    - TP-CREATE-001
    - TP-CREATE-003
    - TP-CONFIG-001
    - TP-CONFIG-002
    - TP-CONFIG-004
    - TP-CONFIG-005
    - TP-MONITOR-001
    - TP-REJECT-001
    - TP-REJECT-003
    - TP-SHUTDOWN-001
    - TP-SUBMIT-001
    - TP-SUBMIT-005
  optional_rules: []
  # bad.java（Executors.newCachedThreadPool + execute）期望命中的违规
  violations:
    - TP-CREATE-001
    - TP-CREATE-003
    - TP-CONFIG-001
    - TP-CONFIG-002
    - TP-MONITOR-001
    - TP-REJECT-003
    - TP-SHUTDOWN-001
  # good.java 允许的提示（CallerRunsPolicy 规则为 info，需要人工确认调用链）
  compliant_violations:
    - TP-REJECT-004
notes:
  - 用例验证"Executors 快捷工厂 + 无界队列"这类最常见问题的召回与误报。
