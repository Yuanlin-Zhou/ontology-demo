id: CASE-016
title: Spring 托管线程池（缺少监控出口）
task: 给订单通知增加一个由 Spring 管理的线程池，参数完整并需要可观测。
language: java
domain: thread_pool
files:
  before: before.java
  bad: bad.java
  good: good.java
expected:
  features:
    - THREAD_POOL.CREATE
    - THREAD_POOL.CONFIG.CORE_SIZE
    - THREAD_POOL.CONFIG.MAX_SIZE
    - THREAD_POOL.CONFIG.QUEUE
    - THREAD_POOL.CONFIG.REJECTION
    - THREAD_POOL.CONFIG.THREAD_FACTORY
    - SPRING.EXECUTOR_BEAN
  rules:
    - TP-CONFIG-001
    - TP-CONFIG-002
    - TP-CONFIG-004
    - TP-CONFIG-005
    - TP-CONFIG-006
    - TP-CREATE-001
    - TP-CREATE-003
    - TP-CREATE-004
    - TP-CREATE-005
    - TP-MONITOR-001
    - TP-REJECT-001
    - TP-REJECT-002
    - TP-REJECT-004
    - TP-SHUTDOWN-001
  optional_rules: []
  violations:
    - TP-MONITOR-001
  compliant_violations: []
notes:
  - ThreadPoolTaskExecutor 由容器负责 destroy，因此 TP-SHUTDOWN-001 / TP-CREATE-005 不报违规。
  - setQueueCapacity(200) 被识别为有界队列与队列容量配置（TP-CONFIG-004 / TP-CONFIG-005 适用）。
