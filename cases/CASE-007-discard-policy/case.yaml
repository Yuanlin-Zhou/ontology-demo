    - THREAD_POOL.CONFIG.REJECTION
    - THREAD_POOL.CONFIG.THREAD_FACTORY
    - THREAD_POOL.SUBMIT
    - THREAD_POOL.EXECUTE
  rules:
    - TP-CONFIG-001
    - TP-CONFIG-002
    - TP-CONFIG-003
    - TP-CONFIG-004
    - TP-CONFIG-005
    - TP-CONFIG-006
    - TP-CREATE-001
    - TP-CREATE-003
    - TP-CREATE-004
    - TP-MONITOR-001
    - TP-REJECT-001
    - TP-REJECT-002
    - TP-REJECT-003
    - TP-REJECT-004
    - TP-SHUTDOWN-001
    - TP-SUBMIT-001
