id: CASE-017
title: 虚拟线程执行阻塞任务（缺少限流与监控）
task: 用虚拟线程改造阻塞式下游通知，同时不能让下游连接被打满。
language: java
domain: thread_pool
files:
  before: before.java
  bad: bad.java
  good: good.java
expected:
  features:
    - THREAD_POOL.CREATE
    - VIRTUAL_THREAD
    - THREAD_POOL.SUBMIT
    - THREAD_POOL.EXECUTE
  rules:
    - TP-CREATE-001
    - TP-CREATE-003
    - TP-MONITOR-001
    - TP-REJECT-001
    - TP-REJECT-003
    - TP-SHUTDOWN-001
    - TP-SUBMIT-001
    - TP-SUBMIT-005
  optional_rules: []
  violations:
    - TP-MONITOR-001
    - TP-REJECT-003
    - TP-SHUTDOWN-001
  compliant_violations: []
notes:
  - 虚拟线程执行器不带队列与拒绝策略，队列/拒绝配置类规则不适用；TP-CREATE-001 只针对 Executors 快捷工厂。
  - good.java 在启动虚拟线程之前用 Semaphore 快速准入，限额内才创建任务；使用 Consumer<String> 注入下游。
  - 独立运行验收观察真实回调线程、饱和拒绝、异常释放、统计及关闭；不能仅检查无关执行器是否支持虚拟线程。
